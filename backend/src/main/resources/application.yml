spring:
  application:
    name: spring-boot-app

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  
  datasource:
    url: jdbc:mysql://localhost:3306/mosquito
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  sql:
    init:
      mode: never
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.example.app: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: your-secret-key-here-change-in-production
  expiration: 86400000

app:
  name: Spring Boot Application
  version: 1.0.0
  upload:
    dir: uploads
